<!DOCTYPE html>
<html>
<head>
<title>Student Management System</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Segoe UI',sans-serif;
}

body{
min-height:100vh;
background:linear-gradient(135deg,#1e3c72,#2a5298);
display:flex;
justify-content:center;
align-items:center;
position:relative;
overflow:hidden;
}

/* glowing background circles */

body::before{
content:"";
position:absolute;
width:350px;
height:350px;
top:-100px;
left:-100px;
background:rgba(255,255,255,0.08);
border-radius:50%;
}

body::after{
content:"";
position:absolute;
width:300px;
height:300px;
bottom:-80px;
right:-80px;
background:rgba(255,255,255,0.08);
border-radius:50%;
}

/* floating icons */

.icon{
position:absolute;
font-size:32px;
color:white;
animation: float 12s linear infinite, glow 2s ease-in-out infinite alternate;
}

/* floating movement */

@keyframes float{

0%{
transform:translateY(100vh) scale(1) rotate(0deg);
opacity:0.5;
}

50%{
transform:translateY(50vh) scale(1.3) rotate(180deg);
opacity:1;
}

100%{
transform:translateY(-100px) scale(1) rotate(360deg);
opacity:0.5;
}

}

/* glow effect */

@keyframes glow{

0%{
text-shadow:
0 0 5px white,
0 0 10px white,
0 0 15px #00eaff;
}

100%{
text-shadow:
0 0 20px white,
0 0 30px #00eaff,
0 0 40px #00eaff;
}

}

/* different icon positions */

.icon:nth-child(1){left:5%;animation-duration:12s;}
.icon:nth-child(2){left:12%;animation-duration:14s;}
.icon:nth-child(3){left:20%;animation-duration:10s;}
.icon:nth-child(4){left:30%;animation-duration:13s;}
.icon:nth-child(5){left:40%;animation-duration:11s;}
.icon:nth-child(6){left:50%;animation-duration:15s;}
.icon:nth-child(7){left:60%;animation-duration:12s;}
.icon:nth-child(8){left:70%;animation-duration:14s;}
.icon:nth-child(9){left:80%;animation-duration:13s;}
.icon:nth-child(10){left:90%;animation-duration:16s;}
.icon:nth-child(11){left:25%;animation-duration:17s;}
.icon:nth-child(12){left:65%;animation-duration:18s;}

/* container */

.container{
display:flex;
flex-direction:column;
align-items:center;
text-align:center;
color:white;
position:relative;
z-index:1;
}

h1{
margin-bottom:35px;
font-size:32px;
letter-spacing:1px;
}

/* card */

.card{
background:linear-gradient(135deg,#f0f8ff,#d6ecff);
padding:40px 30px;
border-radius:20px;
width:340px;
box-shadow:0 15px 35px rgba(0,0,0,0.2);
transition:0.4s;
}

.card:hover{
transform:scale(1.05);
box-shadow:0 0 25px #00e5ff;
}

/* buttons */

.animated-btn{
display:block;
width:100%;
padding:14px;
margin:15px 0;
font-size:16px;
font-weight:bold;
color:white;
border-radius:50px;
text-decoration:none;
position:relative;
overflow:hidden;
transition:0.4s ease;
}

.student-btn{
background:linear-gradient(45deg,#36d1dc,#5b86e5);
}

.staff-btn{
background:linear-gradient(45deg,#11998e,#38ef7d);
}

.animated-btn:hover{
transform:scale(1.05);
box-shadow:0 0 15px rgba(0,0,0,0.3);
}

.animated-btn::before{
content:"";
position:absolute;
top:0;
left:-75%;
width:50%;
height:100%;
background:rgba(255,255,255,0.4);
transform:skewX(-25deg);
transition:0.75s;
}

.animated-btn:hover::before{
left:125%;
}

@media(max-width:400px){
.card{
width:90%;
padding:30px 20px;
}
}

</style>
</head>

<body>

<!-- floating education icons -->

<div class="icon">📚</div>
<div class="icon">✏️</div>
<div class="icon">🎓</div>
<div class="icon">📝</div>
<div class="icon">📖</div>
<div class="icon">📐</div>
<div class="icon">📓</div>
<div class="icon">📏</div>
<div class="icon">🖊️</div>
<div class="icon">📔</div>
<div class="icon">📘</div>
<div class="icon">📙</div>

<div class="container">

<h1>📚 Student Management System</h1>

<div class="card">

<a href="{% url 'student_login' %}" class="animated-btn student-btn">
🎓 Student Login
</a>

<a href="{% url 'staff_login' %}" class="animated-btn staff-btn">
👩‍🏫 Staff Login
</a>

</div>

</div>

</body>
</html>
