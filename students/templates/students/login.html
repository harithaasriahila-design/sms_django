<!DOCTYPE html>
<html>
<head>
    <title>Student Login</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        /* 🔥 Animated Gradient Background */
        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: linear-gradient(-45deg, #1e3c72, #2a5298, #4f46e5, #00c6ff);
            background-size: 400% 400%;
            animation: gradientMove 12s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ✨ Extra floating glow circles */
        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255,255,255,0.1);
            animation: float 15s infinite linear;
        }

        .circle:nth-child(1) { width: 120px; height: 120px; top: 10%; left: 20%; }
        .circle:nth-child(2) { width: 80px; height: 80px; top: 70%; left: 75%; }
        .circle:nth-child(3) { width: 150px; height: 150px; top: 40%; left: 50%; }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-40px); }
            100% { transform: translateY(0px); }
        }

        /* 🟦 Glass Card */
        .card {
            position: relative;
            padding: 40px;
            border-radius: 20px;
            width: 360px;
            text-align: center;
            background: rgba(255,255,255,0.15);
            backdrop-filter: blur(15px);
            color: white;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            overflow: hidden;
            z-index: 1;
        }

        /* 💎 Animated Border Glow */
        .card::before {
            content: "";
            position: absolute;
            inset: -3px;
            border-radius: 22px;
            background: linear-gradient(45deg, #00f2ff, #4f46e5, #00f2ff);
            z-index: -1;
        }

        .card.move-border::before {
            animation: borderRotate 1.5s linear infinite;
        }

        @keyframes borderRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        h2 {
            margin-bottom: 25px;
        }

        .input-group {
            position: relative;
            margin: 15px 0;
        }

        .input-group span {
            position: absolute;
            left: 12px;
            top: 50%;
            transform: translateY(-50%);
        }

        input {
            width: 100%;
            padding: 14px 14px 14px 40px;
            border: none;
            border-radius: 12px;
            outline: none;
        }

        input:focus {
            box-shadow: 0 0 12px rgba(255,255,255,0.6);
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 20px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(45deg, #2563eb, #4f46e5);
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255,255,255,0.6);
        }

        .back-btn {
            margin-top: 15px;
            display: inline-block;
            text-decoration: none;
            color: white;
            font-size: 14px;
            opacity: 0.8;
            transition: 0.3s;
        }

        .back-btn:hover {
            opacity: 1;
            text-decoration: underline;
        }

    </style>
</head>

<body>

    <div class="circle"></div>
    <div class="circle"></div>
    <div class="circle"></div>

    <div class="card" id="loginCard">
        <h2>🎓 Student Login 📚</h2>

        {% if error %}
            <p style="color:#ff6b6b;">⚠️ {{ error }}</p>
        {% endif %}

        <form method="post" onsubmit="animateBorder()">
            {% csrf_token %}
            
           
            <div class="input-group">
                <span>👤</span>
                <input type="text" name="name" placeholder="Enter Name" required>
            </div>

            <div class="input-group">
                <span>🆔</span>
                <input type="text" name="roll_no" placeholder="Enter Roll No" required>
            </div>

            <button type="submit">🔐 Login</button>
        </form>

        <a href="/" class="back-btn">⬅ Back to Home</a>
    </div>

<script>
function animateBorder() {
    let box = document.getElementById("loginCard");
    box.classList.add("move-border");

    setTimeout(() => {
        box.classList.remove("move-border");
    }, 2000);
}
</script>

</body>
</html>
